services:
  - type: web
    name: ops-safety-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    plan: free  # Change to 'standard' for production (always-on)
    region: oregon
    envVars:
      - key: OPS_DEMO_MODE
        value: "false"
      - key: OPS_DEFAULT_BACKEND
        value: pytorch
      - key: OPS_DEFAULT_CPU_THREADS
        value: "4"
      - key: OPS_DEFAULT_FRAME_SKIP
        value: "2"
      - key: OPS_ALERT_PERSISTENCE_FRAMES
        value: "3"
      - key: OPS_ADAPTIVE_RESOLUTION
        value: "true"
      - key: OPS_ENVIRONMENT
        value: production
      - key: OPS_ALLOWED_ORIGINS
        value: '["http://localhost:3000"]'
    healthCheckPath: /health
    scaling:
      minInstances: 1
      maxInstances: 1

  - type: static_site
    name: ops-safety-frontend
    staticPublishPath: ./frontend/dist
    buildCommand: cd frontend && npm install && npm run build
    envVars:
      - key: VITE_API_BASE_URL
        value: https://ops-safety-backend-xxxxx.onrender.com  # Update after backend deployment
