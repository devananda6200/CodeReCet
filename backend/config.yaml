model:
  path: ../model output/best_openvino_model/best.xml
  backend: openvino
  input_size: 640
  confidence_threshold: 0.45
  nms_iou_threshold: 0.5
  half_precision: false
  openvino_fp32_path: model_quantization/artifacts/openvino_fp32/best_openvino_model/best.xml
  openvino_int8_path: model_quantization/artifacts/openvino_int8/best.xml
classes:
  0: helmet
  1: person
  2: safety_vest
streams:
  max_concurrent: 4
  queue_size: 5
  reconnect_delay_sec: 5.0
  reconnect_max_retries: 10
pipeline:
  frame_skip: 3
  tracker_max_disappeared: 15
  tracker_iou_threshold: 0.3
  anti_flicker_min_hits: 3
  tracker_velocity_smoothing: 0.5
resolution:
  tiers:
  - 1920
  - 1280
  - 854
  - 640
  fps_low_threshold: 8.0
  fps_high_threshold: 14.0
  eval_window_sec: 3.0
compliance:
  head_region_ratio: 0.3
  torso_region_top: 0.25
  torso_region_bottom: 0.65
  overlap_iou_threshold: 0.15
alerts:
  cooldown_sec: 10.0
  max_history: 500
  latency_target_ms: 300
metrics:
  collection_interval_sec: 1.0
  fps_window_sec: 5.0
server:
  host: 0.0.0.0
  port: 8000
  cors_origins:
  - '*'
resources:
  max_cpu_cores: 8
  onnx_inter_threads: 2
  onnx_intra_threads: 4
  openvino_num_requests: 2
