services:
  - type: web
    name: ops-safety-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    plan: free  # Change to 'standard' for production (always-on)
    region: oregon
    envVars:
      - key: OPS_DEMO_MODE
        value: "false"
      - key: OPS_DEFAULT_BACKEND
        value: mock
      - key: OPS_DEFAULT_CPU_THREADS
        value: "1"
      - key: OPS_DEFAULT_FRAME_SKIP
        value: "2"
      - key: OPS_ALERT_PERSISTENCE_FRAMES
        value: "3"
      - key: OPS_ADAPTIVE_RESOLUTION
        value: "true"
      - key: OPS_ENVIRONMENT
        value: production
      - key: OPS_ALLOWED_ORIGINS
        value: '["https://ops-safety-monitor-frontend.onrender.com"]'
    healthCheckPath: /health
    scaling:
      minInstances: 1
      maxInstances: 1

  - type: web
    name: ops-safety-frontend
    runtime: static
    staticPublishPath: ./frontend/dist
    buildCommand: cd frontend && npm install && npm run build
    envVars:
      - key: VITE_API_BASE_URL
        value: https://coderecet-g31m.onrender.com
      - key: VITE_STREAM_WS_URL
        value: wss://coderecet-g31m.onrender.com/ws/streams
      - key: VITE_ALERT_WS_URL
        value: wss://coderecet-g31m.onrender.com/ws/alerts
      - key: VITE_METRICS_WS_URL
        value: wss://coderecet-g31m.onrender.com/ws/metrics
